<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentical</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .logo-container {
            text-align: center;
            animation: fadeIn 1.5s ease-out;
        }

        .logo-icon {
            width: clamp(80px, 15vw, 140px);
            height: clamp(80px, 15vw, 140px);
            margin: 0 auto 24px;
        }

        .logo-text {
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            font-weight: 300;
            letter-spacing: 0.35em;
            color: #ffffff;
            text-transform: uppercase;
        }

        .logo-tagline {
            margin-top: 12px;
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            font-weight: 400;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Logo SVG -->
        <svg class="logo-icon" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Outer ring -->
            <circle cx="70" cy="70" r="64" stroke="url(#grad1)" stroke-width="1.5" opacity="0.6"/>

            <!-- Inner geometric shape — hexagon -->
            <polygon
                points="70,22 111.6,46 111.6,94 70,118 28.4,94 28.4,46"
                stroke="url(#grad1)" stroke-width="1.5" fill="none"/>

            <!-- Center node -->
            <circle cx="70" cy="70" r="6" fill="url(#grad1)"/>

            <!-- Connection lines -->
            <line x1="70" y1="70" x2="70" y2="22" stroke="url(#grad1)" stroke-width="1" opacity="0.5"/>
            <line x1="70" y1="70" x2="111.6" y2="46" stroke="url(#grad1)" stroke-width="1" opacity="0.5"/>
            <line x1="70" y1="70" x2="111.6" y2="94" stroke="url(#grad1)" stroke-width="1" opacity="0.5"/>
            <line x1="70" y1="70" x2="70" y2="118" stroke="url(#grad1)" stroke-width="1" opacity="0.5"/>
            <line x1="70" y1="70" x2="28.4" y2="94" stroke="url(#grad1)" stroke-width="1" opacity="0.5"/>
            <line x1="70" y1="70" x2="28.4" y2="46" stroke="url(#grad1)" stroke-width="1" opacity="0.5"/>

            <!-- Outer dots -->
            <circle cx="70" cy="22" r="3" fill="url(#grad1)" opacity="0.8"/>
            <circle cx="111.6" cy="46" r="3" fill="url(#grad1)" opacity="0.8"/>
            <circle cx="111.6" cy="94" r="3" fill="url(#grad1)" opacity="0.8"/>
            <circle cx="70" cy="118" r="3" fill="url(#grad1)" opacity="0.8"/>
            <circle cx="28.4" cy="94" r="3" fill="url(#grad1)" opacity="0.8"/>
            <circle cx="28.4" cy="46" r="3" fill="url(#grad1)" opacity="0.8"/>

            <defs>
                <linearGradient id="grad1" x1="0" y1="0" x2="140" y2="140">
                    <stop offset="0%" stop-color="#6366f1"/>
                    <stop offset="100%" stop-color="#a78bfa"/>
                </linearGradient>
            </defs>
        </svg>

        <div class="logo-text">Agentical</div>
        <div class="logo-tagline">Intelligent Agents</div>
    </div>

</body>
</html>
