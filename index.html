            * {

                padding: 0;

                min-height: 100vh;

                overflow: hidden;
            }

            #particles-canvas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            .logo-container {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 10;
                text-align: center;
                animation: fadeIn 2s ease-out;
            }

            .logo-svg {
                width: clamp(280px, 50vw, 532px);
                height: auto;
                display: block;
                margin: 0 auto;
            }

            .tagline {
                margin-top: 14px;
                font-size: clamp(0.85rem, 2vw, 1.15rem);
                font-weight: 400;
                letter-spacing: 0.05em;
                color: rgba(255, 255, 255, 0.7);
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translate(-50%, -50%) translateY(18px);
                }
                to {
                    opacity: 1;
                    transform: translate(-50%, -50%) translateY(0);
                }
            }
        </style>

        <script>
            const canvas = document.getElementById("particles-canvas");
            const ctx = canvas.getContext("2d");

            let width, height;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener("resize", resize);

            // Particle grid for wave effect
            const spacing = 18;
            const cols = Math.ceil(width / spacing) + 2;
            const rows = Math.ceil(height / spacing) + 2;

            let time = 0;

            function drawParticles() {
                ctx.clearRect(0, 0, width, height);

                const dotSize = 1.2;
                const baseAlpha = 0.25;

                // Multiple wave layers for organic feel
                for (let col = 0; col < cols; col++) {
                    for (let row = 0; row < rows; row++) {
                        const x = col * spacing - spacing;
                        const y = row * spacing - spacing;

                        // Composite wave displacement
                        const dx1 = Math.sin(y * 0.012 + time * 0.7) * 8;
                        const dy1 = Math.cos(x * 0.012 + time * 0.5) * 6;

                        const dx2 =
                            Math.sin(y * 0.025 + x * 0.01 + time * 1.1) * 4;
                        const dy2 =
                            Math.cos(x * 0.02 - y * 0.015 + time * 0.8) * 3;

                        const dx3 = Math.sin(y * 0.008 - time * 0.4) * 5;
                        const dy3 = Math.cos(x * 0.008 + time * 0.3) * 4;

                        const px = x + dx1 + dx2 + dx3;
                        const py = y + dy1 + dy2 + dy3;

                        // Alpha varies with wave position
                        const waveFactor =
                            Math.sin(y * 0.012 + time * 0.7) *
                            Math.cos(x * 0.012 + time * 0.5);

                        const alpha = Math.max(
                            0.02,
                            Math.min(0.6, baseAlpha + waveFactor * 0.35),
                        );

                        ctx.beginPath();
                        ctx.arc(px, py, dotSize, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(100, 110, 180, ${alpha})`;
                        ctx.fill();
                    }
                }

                time += 0.012;
                requestAnimationFrame(drawParticles);
            }

            drawParticles();
        </script>
